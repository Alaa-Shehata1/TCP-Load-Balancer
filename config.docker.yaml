listen_addr: ":9000"
admin_addr: ":8080"
algorithm: "round-robin"
backends:
  - {name: "server-a", host: "server-a", port: 9001}
  - {name: "server-b", host: "server-b", port: 9001}
  - {name: "server-c", host: "server-c", port: 9001}
healthcheck: {interval_secs: 3, timeout_secs: 2, fail_threshold: 2}
timeouts: {dial_secs: 3, idle_secs: 60}
